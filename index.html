<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 디지털 시민 마을 갤러리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#302b27;font-family:system-ui,-apple-system,sans-serif}header{background:linear-gradient(#ffe9da,#fff8ef);padding:36px max(24px,4vw) 24px}h1{margin:0;font-size:clamp(24px,3vw,42px);letter-spacing:-1.4px}p{color:#8b7c71;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:center;gap:24px}.actions{display:flex;gap:10px;flex-shrink:0}button,select,input,textarea{font:inherit}button,select{border:1px solid #f0dfcf;border-radius:16px;background:white;padding:14px 20px;cursor:pointer;font-weight:700;color:inherit}button:hover{filter:brightness(.97)}button:focus-visible,a:focus-visible{outline:3px solid #f89b67}.primary{background:#ff8848;color:white;border:0}main{padding:0 4vw 50px}.toolbar{display:flex;justify-content:space-between;align-items:center;color:#8b7c71;gap:12px;margin:8px 0 20px}.live{font-size:13px;color:#348568}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.card{background:white;border:1px solid #f1e3d5;border-radius:26px;overflow:hidden;box-shadow:0 9px 25px #72401b09}.poster{width:100%;aspect-ratio:3/4;object-fit:contain;background:#f8ede1;display:block}.placeholder{display:grid;place-content:center;text-align:center;background:linear-gradient(135deg,#dcf5ec,#ffe2c2);font-size:64px}.placeholder span{font-size:18px;margin-top:16px}.body{padding:22px}h2{font-size:22px;margin:0 0 14px;overflow-wrap:anywhere}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.tag{background:#e6f1ff;color:#558dc0;padding:5px 10px;border-radius:30px;font-size:14px}.green{background:#e3f5eb;color:#4c9b78}.members{color:#86735e;font-size:14px;margin:12px 0}.visit{display:block;text-align:center;text-decoration:none;color:#47352a;background:#ffe6d5;border-radius:14px;padding:15px;font-weight:700;margin:15px 0}.reactions{display:flex;gap:7px}.reactions button{flex:1;padding:10px 0;font-size:23px}.reactions small{display:block;font-size:13px;color:#89786c}.selected{background:#fff0df;border-color:#ff8848}summary{cursor:pointer;color:#8a7767;font-weight:700;margin:20px 0 8px}.comment{padding:12px 0;border-bottom:1px solid #f3e7dc;overflow-wrap:anywhere;font-size:14px}.comment p{margin:5px 0;color:#584c42}.commentform{display:grid;gap:8px;margin-top:15px}input,textarea{width:100%;border:1px solid #ead9c8;border-radius:14px;padding:14px;background:white;color:#302b27}input:focus,textarea:focus{outline:2px solid #ff8848}.empty{text-align:center;padding:80px 20px;border:2px dashed #eadaca;border-radius:24px;grid-column:1/-1}.empty .icon{font-size:60px}dialog{border:0;border-radius:26px;padding:30px;width:min(700px,94vw);max-height:90vh;color:#302b27}dialog::backdrop{background:#30251c75}dialog h2{font-size:28px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.wide{grid-column:1/-1}label{font-weight:700;display:block}label input{margin-top:9px;font-weight:400}.required{color:#ed6c4e}.drop{background:#fff3e2;border:2px dashed #eddcc6;padding:24px;text-align:center;border-radius:18px;color:#8b7765;cursor:pointer}.drop input{border:0;font-size:13px;background:transparent}.footer{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}.notice{padding:12px;color:#9a4423;background:#fff0e4;border-radius:12px;display:none}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:14px 24px;background:#3f493e;color:white;border-radius:14px;z-index:5;display:none}.preview{max-height:140px;max-width:100%;margin-top:12px}.search{max-width:260px} @media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.wide{grid-column:auto}header{padding:25px 20px}main{padding:0 20px 30px}.actions{width:100%}.actions button{flex:1}.toolbar{flex-wrap:wrap}.search{max-width:100%}dialog{padding:22px}}
</style>
<header><div class="top"><div><h1>🏡 우리반 디지털 시민 마을 갤러리</h1><p>모둠이 만든 웹사이트를 둘러보고 반응과 응원 댓글을 남겨요</p></div><div class="actions"><select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="popular">인기순</option></select><button id="teacher">⚙️ 선생님</button><button class="primary" id="open">＋ 작품 등록</button></div></div></header>
<main><div class="toolbar"><span id="stats">작품을 불러오는 중…</span><span class="live" id="live">● 연결 중</span><input class="search" id="search" placeholder="학교, 모둠, 작품 검색" aria-label="작품 검색"></div><div class="notice" id="error"></div><div class="grid" id="grid"></div></main>
<dialog id="modal"><form id="register"><h2>작품 등록하기</h2><p>우리 모둠의 멋진 작품을 친구들에게 소개해요.</p><div class="fields"><label class="wide">작품 등록 비밀번호 <span class="required">*</span><input name="password" type="password" required maxlength="200" autocomplete="off" placeholder="선생님이 알려주신 비밀번호"></label><label>학교 <span class="required">*</span><input name="school" required maxlength="100" placeholder="예) 외삼초등학교"></label><label>학년 · 반 <span class="required">*</span><input name="grade" required maxlength="100" placeholder="예) 5학년 1반"></label><label>모둠 이름 <span class="required">*</span><input name="team" required maxlength="100" placeholder="예) 3모둠 / 지킴이팀"></label><label>작품 제목<input name="title" maxlength="100" placeholder="예) 착한 댓글 캠페인"></label><label class="wide">모둠원 이름 또는 별명 <span class="required">*</span><input name="members" required maxlength="200" placeholder="쉼표로 구분해서 적어 주세요"></label><label class="wide">웹사이트 링크 <span class="required">*</span><input name="url" type="url" required maxlength="2000" placeholder="https://..."></label><label class="wide">포스터 이미지<div class="drop" id="drop">🖼️ 이미지를 고르거나 여기에 끌어다 놓으세요<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>PNG, JPG, WEBP, GIF · 최대 4MB</small><br><img id="preview" class="preview" hidden></div></label></div><p class="notice" id="formerror"></p><div class="footer"><button type="button" id="cancel">취소</button><button class="primary" id="submit">등록하기</button></div></form></dialog><div id="toast" role="status"></div>
<dialog id="deleteModal"><form id="deleteForm"><h2>작품 삭제</h2><p id="deleteTitle"></p><p>이 작품의 댓글과 반응도 함께 삭제됩니다. 삭제 후에는 되돌릴 수 없습니다.</p><label>선생님 비밀번호<input name="password" type="password" required maxlength="200" autocomplete="off"></label><p class="notice" id="deleteError"></p><div class="footer"><button type="button" id="deleteCancel">취소</button><button class="primary" id="deleteSubmit">삭제하기</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let teacherMode=false,deleteId=null;let works=[],poster='',client=localStorage.galleryClient||(localStorage.galleryClient=crypto.randomUUID());const emojis=['👍','💗','😮','💡'];
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'요청을 처리하지 못했어요.');return v}
function render(){const active=document.activeElement;const activeForm=active?.closest('.commentform');const focus=activeForm?{id:activeForm.dataset.id,name:active.name,start:active.selectionStart,end:active.selectionEnd}:null;const opened=new Set([...document.querySelectorAll('details[open]')].map(x=>x.dataset.id));const drafts={};document.querySelectorAll('.commentform').forEach(f=>drafts[f.dataset.id]={name:f.elements.name.value,text:f.elements.text.value});let list=works.filter(w=>[w.school,w.team,w.title,w.grade].join(' ').includes($('#search').value));if($('#sort').value==='popular')list=[...list].sort((a,b)=>Object.keys(b.reactions).length-Object.keys(a.reactions).length);$('#stats').textContent=`🏡 작품 ${works.length}개 · 반응 ${works.reduce((n,w)=>n+Object.keys(w.reactions).length,0)}개 · 댓글 ${works.reduce((n,w)=>n+w.comments.length,0)}개`;
$('#grid').innerHTML=list.length?list.map(w=>`<article class="card">${w.poster?`<img class="poster" src="${esc(w.poster)}" alt="${esc(w.title)} 홍보 포스터">`:`<div class="poster placeholder">🏡<span>우리 모둠의 디지털 세상</span></div>`}<div class="body"><h2>${esc(w.title)}</h2>${teacherMode?`<button data-delete="${w.id}" style="color:#b5412d;margin-bottom:14px">🗑️ 작품 삭제</button>`:''}<div class="tags"><span class="tag">🏫 ${esc(w.school)}</span><span class="tag">📚 ${esc(w.grade)}</span><span class="tag green">👥 ${esc(w.team)}</span></div><div class="members">${esc(w.members)}</div><a class="visit" href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">🔗 사이트 방문하기 ↗</a><div class="reactions">${emojis.map(e=>`<button aria-label="${e} 반응" aria-pressed="${!!w.reactions[client+':'+e]}" class="${w.reactions[client+':'+e]?'selected':''}" data-work="${w.id}" data-emoji="${e}">${e}<small>${Object.values(w.reactions).filter(v=>v===e).length}</small></button>`).join('')}</div><details data-id="${w.id}" ${opened.has(w.id)?'open':''}><summary>💬 댓글 ${w.comments.length}개 보기</summary>${w.comments.map(c=>`<div class="comment"><strong>${esc(c.name)}</strong><p>${esc(c.text)}</p></div>`).join('')}<form class="commentform" data-id="${w.id}"><input name="name" placeholder="이름 또는 별명" required maxlength="40" aria-label="댓글 작성자"><textarea name="text" placeholder="친구에게 따뜻한 응원을 남겨요" required maxlength="500" aria-label="댓글 내용"></textarea><button>응원 남기기</button></form></details></div></article>`).join(''):`<div class="empty"><div class="icon">🌱</div><h2>${works.length?'검색 결과가 없어요':'우리 반의 첫 작품을 기다리고 있어요'}</h2><p>완성한 웹사이트와 홍보 포스터를 등록하고<br>친구들과 함께 디지털 시민 마을을 만들어 보세요.</p><button class="primary" onclick="document.querySelector('#modal').showModal()">＋ 첫 작품 등록하기</button></div>`;document.querySelectorAll('.commentform').forEach(f=>{if(drafts[f.dataset.id]){f.elements.name.value=drafts[f.dataset.id].name;f.elements.text.value=drafts[f.dataset.id].text}});if(focus){const f=[...document.querySelectorAll('.commentform')].find(f=>f.dataset.id===focus.id);const el=f?.elements[focus.name];if(el){el.focus({preventScroll:true});el.setSelectionRange(focus.start,focus.end)}}}
let refreshing=false,refreshAgain=false;async function refresh(){if(refreshing){refreshAgain=true;return}refreshing=true;try{const r=await fetch('/api/works');if(!r.ok)throw Error();works=await r.json();render();$('#error').style.display='none'}catch(e){$('#error').textContent='작품을 불러오지 못했어요. 서버 연결을 확인해 주세요.';$('#error').style.display='block'}finally{refreshing=false;if(refreshAgain){refreshAgain=false;refresh()}}}
$('#open').onclick=()=>$('#modal').showModal();$('#cancel').onclick=()=>$('#modal').close();$('#sort').onchange=render;$('#search').oninput=render;
async function choose(f){if(!f)return;if(f.size>4*1024*1024||!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)){toast('4MB 이하의 PNG, JPG, WEBP, GIF 이미지를 선택해 주세요.');return}poster=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});$('#preview').src=poster;$('#preview').hidden=false}
$('#file').onchange=e=>choose(e.target.files[0]);$('#drop').ondragover=e=>e.preventDefault();$('#drop').ondrop=e=>{e.preventDefault();choose(e.dataTransfer.files[0])};
$('#register').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;try{await api('/api/works',{...Object.fromEntries(new FormData(e.target)),poster});$('#modal').close();e.target.reset();poster='';$('#preview').hidden=true;$('#formerror').style.display='none';await refresh();toast('작품이 등록되었어요! 🎉')}catch(err){$('#formerror').textContent=err.message;$('#formerror').style.display='block'}finally{$('#submit').disabled=false}};
$('#grid').onclick=async e=>{const remove=e.target.closest('[data-delete]');if(remove){deleteId=remove.dataset.delete;$('#deleteTitle').textContent=works.find(w=>w.id===deleteId)?.title||'작품';$('#deleteForm').reset();$('#deleteError').style.display='none';$('#deleteModal').showModal();return}const b=e.target.closest('[data-emoji]');if(!b)return;b.disabled=true;try{await api('/api/works/'+b.dataset.work+'/react',{client,emoji:b.dataset.emoji});await refresh()}catch(err){toast(err.message);b.disabled=false}};
$('#grid').onsubmit=async e=>{if(!e.target.matches('.commentform'))return;e.preventDefault();const f=e.target;f.querySelector('button').disabled=true;try{await api('/api/works/'+f.dataset.id+'/comments',Object.fromEntries(new FormData(f)));f.elements.text.value='';await refresh();toast('응원을 남겼어요!')}catch(err){toast(err.message);f.querySelector('button').disabled=false}};
$('#teacher').onclick=()=>{teacherMode=!teacherMode;$('#teacher').textContent=teacherMode?'관리 종료':'⚙️ 선생님';render()};
$('#deleteCancel').onclick=()=>$('#deleteModal').close();
$('#deleteModal').onclose=()=>$('#deleteForm').reset();
$('#modal').addEventListener('close',()=>{$('#register').elements.password.value=''});
$('#deleteForm').onsubmit=async e=>{e.preventDefault();$('#deleteSubmit').disabled=true;try{await api('/api/works/'+deleteId+'/delete',{password:e.target.elements.password.value});$('#deleteModal').close();await refresh();toast('작품을 삭제했습니다.')}catch(err){$('#deleteError').textContent=err.message;$('#deleteError').style.display='block'}finally{$('#deleteSubmit').disabled=false}};
const events=new EventSource('/api/events');events.onopen=()=>$('#live').textContent='● 실시간 연결됨';events.onmessage=refresh;events.onerror=()=>$('#live').textContent='○ 다시 연결하는 중…';refresh();
</script></html>
