<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 알지만 실습터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 밤하늘 아래 디지털 마을(홈) → 차시별 '집'에 들어가 단계 레일을 따라 실습. 완료한 집은 창문에 불이 켜진다. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d9e0ea;
  --ink:#16213a; --muted:#5b6780; --lamp:#f4b400; --lamp-soft:#fff4cf;
  --night:#121b33; --night-2:#1f2c4f; --night-ink:#e9eefb;
  --ok:#1f8a5b; --ok-soft:#e1f4ea; --warn:#b87400; --warn-soft:#fff1d6; --bad:#c23c3c; --bad-soft:#fde6e6;
  --c1:#2f6fd6; --c2:#138a79; --c3:#6c4bd6; --c4:#d1467c; --c5:#d07a12; --c6:#b58600;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#161f36; --surface-2:#1c2742; --line:#2c3a5c;
  --ink:#e8edf8; --muted:#a3afc8; --lamp:#ffc83d; --lamp-soft:#3a3218;
  --night:#0a1020; --night-2:#16213d; --night-ink:#e9eefb;
  --ok:#4fc58b; --ok-soft:#163a2a; --warn:#f0b54a; --warn-soft:#3a2e14; --bad:#f07a7a; --bad-soft:#3d1c1f;
  --c1:#6ea2ff; --c2:#3cc7b2; --c3:#a48bff; --c4:#ff7fae; --c5:#ffaa4a; --c6:#ffd24d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#161f36; --surface-2:#1c2742; --line:#2c3a5c;
  --ink:#e8edf8; --muted:#a3afc8; --lamp:#ffc83d; --lamp-soft:#3a3218;
  --night:#0a1020; --night-2:#16213d; --night-ink:#e9eefb;
  --ok:#4fc58b; --ok-soft:#163a2a; --warn:#f0b54a; --warn-soft:#3a2e14; --bad:#f07a7a; --bad-soft:#3d1c1f;
  --c1:#6ea2ff; --c2:#3cc7b2; --c3:#a48bff; --c4:#ff7fae; --c5:#ffaa4a; --c6:#ffd24d;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lamp{background:var(--lamp);color:#1b1a12;border-color:var(--lamp)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- 홈 ---------- */
.hero{background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%);color:var(--night-ink);overflow:hidden}
.hero .wrap{padding-block:40px 0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-size:14px;font-weight:700;letter-spacing:.06em;color:#aab6d6}
.hero h1{font-size:clamp(40px,7vw,76px);line-height:1.02;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--lamp)}
.hero p.lede{max-width:560px;color:#c3cce3;margin:14px 0 0;font-size:17px}
.hero .pill{display:inline-block;border:1px solid #3a4a75;border-radius:999px;padding:6px 12px;font-size:13px;color:#c3cce3;text-decoration:none}
.hero .pill:hover{border-color:#8796c0}
.village{display:block;width:100%;height:auto;margin-top:26px}
.village .win{fill:#2a3558;transition:fill .6s}
.village .lit .win{fill:var(--lamp);filter:drop-shadow(0 0 6px var(--lamp))}
.village text{font-family:var(--f-display);font-size:20px;fill:#c9d2ea}
.village .lit text{fill:#fff}
.village .house{cursor:pointer}
.village .house:hover .body{filter:brightness(1.25)}
.progress-line{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-block:14px 18px;color:#c3cce3;font-size:14px;border-top:1px solid #2a3762}
.bar{flex:1;min-width:140px;height:8px;background:#26335a;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp);border-radius:99px;transition:width .6s}
.home-main{padding-block:36px 64px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.section-head h2{font-size:32px}
.section-head p{margin:4px 0 0;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.lesson .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lesson .num{font-family:var(--f-display);font-size:15px;color:var(--c);border:1.5px solid var(--c);border-radius:999px;padding:2px 10px}
.lesson .house-name{font-family:var(--f-display);font-size:30px;color:var(--c);line-height:1.1}
.lesson h3{font-family:var(--f-body);font-weight:700;font-size:17px;line-height:1.4}
.lesson ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;color:var(--muted);font-size:14.5px}
.lesson li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--c);margin-right:8px;vertical-align:2px}
.lesson .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:6px}
.lesson .actions .btn.main{background:var(--c);border-color:var(--c);color:#fff}
.state{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted)}
.state.on{background:var(--lamp-soft);color:var(--warn)}
.state.done{background:var(--lamp);color:#1b1a12}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.extra .box{border:1px dashed var(--line);border-radius:16px;padding:18px;min-width:0}
.extra h3{font-size:20px;margin-bottom:6px}
.extra p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.foot{color:var(--muted);font-size:13px;padding-block:20px 40px;border-top:1px solid var(--line)}

/* ---------- 차시 화면 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.lbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.lbar .ttl{flex:1;min-width:180px;display:flex;align-items:baseline;gap:10px}
.lbar .ttl b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--c)}
.lbar .ttl span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead{padding-block:28px 10px}
.lhead .house-name{font-family:var(--f-display);font-size:clamp(34px,5vw,52px);color:var(--c);line-height:1.05}
.lhead p{margin:6px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;padding-block:12px 70px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:4px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.rail button{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer;color:var(--muted);font-size:14.5px;line-height:1.35}
.rail button .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rail button.seen .n{border-color:var(--c);color:var(--c)}
.rail button.cur{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.rail button.cur .n{background:var(--c);border-color:var(--c);color:#fff}
.stage{min-width:0}
.step-head{margin-bottom:18px}
.step-head .tag{display:inline-block;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.step-head h2{font-size:clamp(28px,4vw,38px);line-height:1.15}
.step-head p{margin:8px 0 0;color:var(--muted);max-width:66ch}
.blocks{display:grid;gap:18px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.blk > h3{font-family:var(--f-body);font-weight:700;font-size:17px;margin-bottom:10px}
.blk > .hint{margin:-4px 0 12px;color:var(--muted);font-size:14.5px}
.plain{background:none;border:0;padding:0}
.story{border-left:4px solid var(--c);background:var(--surface-2)}
.story .who{font-family:var(--f-display);font-size:20px;color:var(--c);margin-bottom:6px}
.story p{margin:0 0 8px;font-size:16.5px}
.quote{font-family:var(--f-display);font-size:clamp(20px,3vw,26px);line-height:1.45;background:var(--lamp-soft);border:0;text-align:center;padding:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);min-width:0}
.card .k{font-family:var(--f-display);font-size:15px;color:var(--c)}
.card h4{margin:2px 0 4px;font-size:16.5px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.reveal{display:grid;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rv button{width:100%;text-align:left;background:var(--surface-2);border:0;padding:14px 16px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.rv button::after{content:"답 보기";font-size:13px;color:var(--c);white-space:nowrap}
.rv.open button::after{content:"접기"}
.rv .a{padding:12px 16px;border-top:1px solid var(--line);color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .mk{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.info{background:var(--surface-2);border-left:4px solid var(--c)}
.row-q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row-q:first-of-type{border-top:0}
.row-q .ex{grid-column:1/-1;font-size:14.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 13px;cursor:pointer;font-weight:700;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.sel{background:var(--ink);color:var(--bg)}
.seg button.right{background:var(--ok);color:#fff}
.seg button.wrong{background:var(--bad);color:#fff}
.fill{font-size:17px;line-height:2.3}
.fill select{border:1.5px dashed var(--c);background:var(--surface-2);border-radius:8px;padding:2px 6px;font-weight:700}
.fill select.right{border:1.5px solid var(--ok);background:var(--ok-soft)}
.fill select.wrong{border:1.5px solid var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bank span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.spot{font-size:17.5px;line-height:2;background:var(--surface-2);border-radius:12px;padding:16px}
.spot .w{cursor:pointer;border-radius:4px;padding:1px 0}
.spot .w:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.spot .w.found{background:var(--lamp);color:#1b1a12;text-decoration:underline;text-decoration-thickness:2px}
.spot .w.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.found-list{display:grid;gap:8px;margin-top:12px}
.found-list div{border-left:4px solid var(--lamp);background:var(--surface-2);padding:10px 12px;border-radius:8px;font-size:15px}
.found-list b{display:block}
.count{font-weight:700;color:var(--c)}
.order-pool,.order-seq{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.order-seq{border:1.5px dashed var(--line);border-radius:12px;padding:8px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:15px}
.chip .i{color:var(--c);margin-right:6px;font-variant-numeric:tabular-nums}
.chip.right{border-color:var(--ok);background:var(--ok-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{font-weight:700;font-size:15px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.field textarea{resize:vertical}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;position:relative}
.chain .field{margin:0;position:relative}
.chain .field:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:34px;color:var(--c);font-weight:700}
.chain .field label{color:var(--c)}
.checks{display:grid;gap:8px}
.ck{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.ck input{width:20px;height:20px;margin-top:3px;accent-color:var(--c);flex:0 0 auto}
.ck.on{background:var(--ok-soft);border-color:var(--ok)}
.ck small{display:block;color:var(--muted);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.out{position:relative;background:var(--night);color:var(--night-ink);border-radius:12px;padding:16px;white-space:pre-wrap;font-size:15px;line-height:1.7;margin-top:12px;overflow-wrap:anywhere}
.out mark{background:var(--lamp);color:#1b1a12;border-radius:3px;padding:0 2px}
.out-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.out-actions .msg{font-size:14px;color:var(--ok);font-weight:700}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.lk{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.lk:hover{border-color:var(--c)}
.lk b{display:block;color:var(--c)}
.lk span{font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:520px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px;text-align:center;font-size:15px}
.tbl th{background:var(--surface-2)}
.tbl td:first-child{text-align:left;font-weight:700}
.tbl select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-weight:700}
.tbl .exv{display:block;font-size:12.5px;color:var(--muted)}
.signal .sc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
.signal .sc p{margin:0 0 10px;font-weight:700}
.lights{display:flex;gap:8px;flex-wrap:wrap}
.lights button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.lights i{width:12px;height:12px;border-radius:50%;display:inline-block}
.lights .g i{background:#2fae62}.lights .y i{background:#f2b705}.lights .r i{background:#e04646}
.lights button.right{border-color:var(--ok);background:var(--ok-soft)}
.lights button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pc-result{margin-top:12px}
.pc-result ul{margin:6px 0 0;padding-left:20px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.done-box{text-align:center;background:var(--lamp-soft);border:0}
.done-box h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:6px}
.vil{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}
.vil .b{border-radius:12px;padding:14px 8px;text-align:center;background:var(--night);color:#8c98b8;font-family:var(--f-display);font-size:19px;border:2px solid transparent}
.vil .b small{display:block;font-family:var(--f-body);font-size:12.5px}
.vil .b.on{color:#1b1a12;background:var(--lamp)}
.vil .b.mid{color:var(--night-ink);background:#5a5230}
.vil .b.weak{border-color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20}
@media (max-width:900px){
  .lessons,.extra{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{grid-template-columns:1fr}
  .rail{position:static;display:flex;overflow-x:auto;max-height:none;padding-bottom:6px;gap:6px}
  .rail button{grid-template-columns:24px auto;white-space:nowrap;flex:0 0 auto;padding:6px 10px}
  .rail button .n{width:24px;height:24px}
  .chain{grid-template-columns:1fr 1fr}
  .chain .field:nth-child(2)::after{content:none}
}
@media (max-width:560px){
  .lessons,.extra{grid-template-columns:1fr}
  .chain{grid-template-columns:1fr;gap:12px}
  .chain .field::after{content:none!important}
  .vil{grid-template-columns:repeat(3,minmax(0,1fr))}
  .blk{padding:16px}
  .lbar .ttl span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ======================== 데이터 ======================== */
const PADLET = "https://xn--0p4b.xn--3e0b707e/AI%EC%95%8C%EC%A7%80%EB%A7%8C/";
const PADLET_LABEL = "숏.한국/AI알지만";
const DIAG = "https://digital-village-diagnosis.vercel.app";

const L = [
{ id:"l1", n:1, house:"권리의 집", color:"--c1",

function shuffle(a,seed){a=a.slice();let x=seed||7;for(let i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 grid:(b,k)=>{const v=getA(k)||{};const show=v._ex;return`<section class="blk">${head(b)}<div class="tbl"><table><thead><tr><th>앱</th>${b.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r,ri)=>`<tr><td>${r}</td>${b.cols.map((c,ci)=>{const cur=v[ri+"-"+ci]||"";return`<td><select data-act="gd" data-k="${k}" data-i="${ri}-${ci}" aria-label="${r} ${c}"><option value="">-</option>${["○","△","X"].map(o=>`<option ${cur===o?"selected":""}>${o}</option>`).join("")}</select>${show?`<span class="exv">예시 ${b.ex[ri][ci]}</span>`:""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div><div class="out-actions"><button class="btn small" data-act="gdex" data-k="${k}">${show?"예시 답안 숨기기":"예시 답안과 비교하기"}</button></div>${show?`<div class="fb info">${b.note}</div>`:""}</section>`},
 signal:(b,k)=>{const v=getA(k)||{};const names=[["g","괜찮아요"],["y","생각해 봐요"],["r","멈춰요"]];return`<section class="blk signal">${head(b)}${b.items.map((x,i)=>{const a=v[i];const done=a!=null;return`<div class="sc"><p>상황 ${i+1}. ${x.s}</p><div class="lights">${names.map(([c,n],ci)=>{let cl=c;if(done){if(ci===x.a)cl+=" right";else if(ci===a)cl+=" wrong"}return`<button class="${cl}" data-act="sg" data-k="${k}" data-i="${i}" data-v="${ci}"><i></i>${n}</button>`}).join("")}</div>${done?`<div class="fb ${a===x.a?"ok":"no"}">${x.ex}</div>`:""}</div>`}).join("")}</section>`},
 precheck:(b,k)=>{const v=getA(k)||{};const items=b.items.map(s=>{if(s.startsWith("@")){const [ref,def]=s.slice(1).split("|");return named(ref)||def}return s});const res=v._r;const miss=items.filter((_,i)=>!v["c"+i]);const id="pc-"+k.replace(/\./g,"-");return`<section class="blk">${head(b)}<div class="field"><label for="${id}-in">${b.input}</label><input id="${id}-in" data-act="pcin" data-k="${k}" value="${esc(v.in||"")}" placeholder="${b.input}을 적어요"></div>${b.judge?`<div class="field"><label for="${id}-src">확인한 근거 (자료명·쪽수 또는 링크)</label><input id="${id}-src" data-act="pcsrc" data-k="${k}" value="${esc(v.src||"")}"></div>`:""}<div class="checks">${items.map((s,i)=>`<label class="ck ${v["c"+i]?"on":""}"><input type="checkbox" data-act="pcck" data-k="${k}" data-i="${i}" ${v["c"+i]?"checked":""}><span><b>${esc(s)}</b></span></label>`).join("")}</div><div class="out-actions"><button class="btn small main" data-act="pcgo" data-k="${k}">결과 보기</button></div>${res?`<div class="pc-result fb ${miss.length?"no":"ok"}"><b>${miss.length?b.missing:b.all}</b>${miss.length?`<ul>${miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}</div>`:""}${b.judge&&res?`<div class="field" style="margin-top:12px"><label for="${id}-j">최종 판단 (사람이 직접 골라요)</label><select id="${id}-j" data-act="pcj" data-k="${k}">${["선택하세요","사실","오류","확인 필요"].map(o=>`<option ${v.j===o?"selected":""}>${o}</option>`).join("")}</select></div><div class="field"><label for="${id}-why">판단 이유</label><textarea id="${id}-why" rows="2" data-act="pcwhy" data-k="${k}">${esc(v.why||"")}</textarea></div>`:""}${res?`<div class="out-actions"><button class="btn small" data-act="pccopy" data-k="${k}">기록 텍스트 복사</button></div>`:""}</section>`},
 village:(b,k)=>{const v=getA(k)||{};const n=Object.keys(v).length;return`<section class="blk">${b.items.map((x,i)=>{const ord=shuffle(x.o.map((_,j)=>j),i*31+5);return`<div class="sc" style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface-2)"><p style="margin:0 0 10px;font-weight:700">빠른 진단 ${i+1}/5 · ${x.b} — ${x.s}</p><div class="opts">${ord.map((j,p)=>`<button class="opt ${v[i]===j?"right":""}" style="${v[i]===j?"border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)":""}" data-act="vl" data-k="${k}" data-i="${i}" data-v="${j}"><span class="mk">${"ABC"[p]}</span><span>${x.o[j][0]}</span></button>`).join("")}</div></div>`}).join("")}${n===b.items.length?villageResult(b,v):`<p class="hint" style="margin:6px 0 0">${n} / 5 진단했어요. 다섯 장면을 모두 고르면 마을에 불이 켜져요.</p>`}</section>`},
 comment:(b,k)=>{const v=getA(k)||{};const txt=commentText(v);const flags=redFlags(txt);return`<section class="blk">${head(b)}<div class="field"><label for="cm-1">① 칭찬 (좋은 점)</label><textarea id="cm-1" rows="2" data-act="cm" data-k="${k}" data-key="a" placeholder="예) 점검기에 예·아니요로 답하니 바로 결과가 나와서 쉬웠어요.">${esc(v.a||"")}</textarea></div><div class="field"><label for="cm-2">② 질문 및 제안</label><textarea id="cm-2" rows="2" data-act="cm" data-k="${k}" data-key="b" placeholder="예) 친구가 싫다고 할 때 어떻게 하는지도 결과 화면에 넣으면 좋겠어요.">${esc(v.b||"")}</textarea></div><div class="field"><label for="cm-3">③ 나의 실천 다짐</label><textarea id="cm-3" rows="2" data-act="cm" data-k="${k}" data-key="c" placeholder="예) 저도 사진을 올리기 전에 위치·배경을 살피고 동의를 구할게요.">${esc(v.c||"")}</textarea></div><div class="out" id="cm-out">${esc(txt)||"세 칸을 채우면 댓글이 완성돼요."}</div><div id="cm-flags">${flagHTML(flags)}</div><div class="out-actions"><button class="btn small lamp" data-act="copycm" data-k="${k}">댓글 복사해서 패들렛에 붙이기</button></div></section>`},
 done:(b,k,l)=>`<section class="blk done-box"><h3>${S.done[l.id]?`${l.house}에 불이 켜졌어요`:`${l.house}에 불을 켤까요?`}</h3><p>${b.next}</p><div class="out-actions" style="justify-content:center"><button class="btn lamp" data-act="done" data-k="${k}" data-l="${l.id}">${S.done[l.id]?"홈에서 마을 보기":"이 차시 완료하고 불 켜기"}</button></div></section>`
};
function promptHTML(b,k){const v=getA(k)||{};return esc(b.tpl).replace(/\{\{([^}]+)\}\}/g,(_,s)=>{s=s.replace(/&quot;/g,'"');if(s.startsWith("+")){const [key,txt]=s.slice(1).split("|");return v[key]?"\n+ "+esc(txt):""}const [key,label,def]=s.split("|");const ref=def&&def.startsWith("@")?named(def.slice(1)):"";const val=v[key]??(ref||(def&&!def.startsWith("@")?def:""));return val?`<mark>${esc(val)}</mark>`:`[${esc(label)}]`})}
function promptText(b,k){const d=document.createElement("div");d.innerHTML=promptHTML(b,k);return d.textContent}
function composeText(b,k){const v=getA(k)||{};return [b.base,...b.opts.filter((_,i)=>v[i])].join("\n")}
function commentText(v){return [v.a&&"👍 "+v.a.trim(),v.b&&"💡 "+v.b.trim(),v.c&&"🌱 "+v.c.trim()].filter(Boolean).join("\n")}
const FLAGS=[["외모 평가",/못생|잘생|뚱뚱|키\s*작|얼굴이|외모/],["비난·조롱",/바보|멍청|한심|별로|구려|최악|노잼|짜증|ㅉㅉ|병맛/],["실명·연락처",/01[0-9][-\s]?\d{3,4}[-\s]?\d{4}|@[a-z0-9_.]+/i]];
function redFlags(t){return FLAGS.filter(([,re])=>re.test(t)).map(([n])=>n)}
function flagHTML(f){return f.length?`<div class="fb no" style="margin-top:10px">Red Flag 의심: ${f.join(", ")}. 존중하는 말로 바꿔 볼까요?</div>`:`<div class="fb ok" style="margin-top:10px">Green Flag! 실명·외모 평가·비난이 보이지 않아요. (자동 확인은 일부 표현만 찾으니, 마지막 점검은 직접 해요.)</div>`}
function villageResult(b,v){const cls=x=>x===2?"on":x===1?"mid":"";const min=Math.min(...b.items.map((_,i)=>v[i]));const weak=b.items.map((x,i)=>v[i]===min?x.b:null).filter(Boolean);return`<h3 style="margin:16px 0 8px;font-family:var(--f-display);font-weight:400;font-size:24px">마을에 불 켜기: 3, 2, 1!</h3><div class="vil">${b.items.map((x,i)=>`<div class="b ${cls(v[i])} ${v[i]===min&&min<2?"weak":""}">${x.b}<small>${v[i]===2?"불 켜짐":v[i]===1?"흔들림":"무너짐"}</small></div>`).join("")}</div><div class="fb info">${min===2?"다섯 건물에 모두 불이 켜졌어요! 반 진단 결과에서 지키는 선택 비율이 가장 낮은 건물을 찾아요.":`먼저 도울 곳: <b>${weak.join(", ")}</b>. 누가 잘하고 못했는지가 아니라 먼저 도울 곳이에요. 이 건물을 지키는 「우리 반 디지털 약속」을 만들어요.`}</div>`}

/* ======================== 차시 화면 ======================== */
let cur=null,resetArm=false;
function renderLesson(id){
  const l=L.find(x=>x.id===id);if(!l)return renderHome();
  cur=l;S.seen[l.id]=true;save();
  const si=Math.min(S.step[l.id]||0,l.steps.length-1);const st=l.steps[si];
  document.title=`${l.n}차시 ${l.house} · AI 알지만 실습터`;
  const seenSteps=S.a["_v:"+l.id]||[];if(!seenSteps.includes(si)){seenSteps.push(si);S.a["_v:"+l.id]=seenSteps;save()}
  $("#app").innerHTML=`<div style="--c:var(${l.color})">
  <div class="lbar"><div class="wrap">
    <a class="btn small" href="#home" aria-label="홈으로">← 홈</a>
    <div class="ttl"><b>${l.n}차시 · ${l.house}</b><span>${l.title}</span></div>
    <a class="btn small" href="${l.canva}" target="_blank" rel="noopener">학습교안 ↗</a>
  </div></div>
  <div class="wrap">
    <div class="lhead"><div class="eyebrow">${l.n}차시 / AI 알지만</div><div class="house-name">${l.house}</div><p>${l.title}</p></div>
    <div class="layout">
      <nav class="rail" aria-label="단계">${l.steps.map((s,i)=>`<button class="${i===si?"cur":""} ${seenSteps.includes(i)?"seen":""}" data-step="${i}" ${i===si?'aria-current="step"':""}><span class="n">${i+1}</span><span>${s.h}</span></button>`).join("")}</nav>
      <div class="stage">
        <div class="step-head"><span class="tag">${si+1}단계 · ${st.tag}</span><h2>${st.h}</h2>${st.p?`<p>${st.p}</p>`:""}</div>
        <div class="blocks" id="blocks">${st.blocks.map((b,bi)=>R[b.t](b,bk(l,si,bi),l)).join("")}</div>
        <div class="nav">
          <button class="btn" data-step="${si-1}" ${si===0?"disabled":""}>← 이전 단계</button>
          ${si<l.steps.length-1?`<button class="btn main" style="background:var(--c);border-color:var(--c);color:#fff" data-step="${si+1}">다음: ${l.steps[si+1].h} →</button>`:`<a class="btn" href="#home">홈으로</a>`}
        </div>
      </div>
    </div>
  </div></div>`;
  const railCur=$(".rail .cur");if(railCur&&window.matchMedia("(max-width:900px)").matches)railCur.scrollIntoView({inline:"center",block:"nearest"});
}
function rerenderBlock(k){
  const [lid,si,bi]=k.split(".");const l=L.find(x=>x.id===lid);const b=l.steps[+si].blocks[+bi];
  const el=$("#blocks").children[+bi];const tmp=document.createElement("div");tmp.innerHTML=R[b.t](b,k,l);el.replaceWith(tmp.firstElementChild);
}
function blockOf(k){const [lid,si,bi]=k.split(".");return L.find(x=>x.id===lid).steps[+si].blocks[+bi]}
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text);toast("복사했어요. 캔바 AI ‘코드’나 패들렛에 붙여 넣어요")}
  catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();toast(ok?"복사했어요":"복사가 막혀 있어요. 검은 상자의 글을 길게 눌러 직접 복사해 주세요")}
}

/* ======================== 이벤트 ======================== */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-step]");if(s&&cur&&!s.disabled){S.step[cur.id]=+s.dataset.step;save();renderLesson(cur.id);window.scrollTo({top:0,behavior:"smooth"});return}
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,k=t.dataset.k;
  if(a==="rv"){const o=getA(k)||{};o[t.dataset.i]=!o[t.dataset.i];setA(k,o);rerenderBlock(k)}
  else if(a==="quiz"){setA(k,+t.dataset.i);rerenderBlock(k)}
  else if(a==="ox"){const o=getA(k)||{};o[t.dataset.i]=t.dataset.v==="true";setA(k,o);rerenderBlock(k)}
  else if(a==="sort"||a==="sg"){const o=getA(k)||{};o[t.dataset.i]=+t.dataset.v;setA(k,o);rerenderBlock(k)}
  else if(a==="vl"){const o=getA(k)||{};o[t.dataset.i]=+t.dataset.v;setA(k,o);rerenderBlock(k)}
  else if(a==="fillcheck"){const o=getA(k)||{};o._c=true;setA(k,o);rerenderBlock(k)}
  else if(a==="spot"){const o=getA(k)||{};if(t.dataset.t!=null){o[t.dataset.t]=true;setA(k,o);rerenderBlock(k)}else{t.classList.remove("miss");void t.offsetWidth;t.classList.add("miss")}}
  else if(a==="spotall"){const o={};for(let i=0;i<+t.dataset.n;i++)o[i]=true;setA(k,o);rerenderBlock(k)}
  else if(a==="ord"){const o=getA(k)||[];o.push(+t.dataset.i);setA(k,o);rerenderBlock(k)}
  else if(a==="ordreset"){setA(k,[]);rerenderBlock(k)}
  else if(a==="copy"){copy(t.dataset.text)}
  else if(a==="copyp"){copy(promptText(blockOf(k),k))}
  else if(a==="copycm"){const txt=commentText(getA(k)||{});if(!txt){toast("세 칸 중 하나 이상 채워 주세요");return}copy(txt)}
  else if(a==="gdex"){const o=getA(k)||{};o._ex=!o._ex;setA(k,o);rerenderBlock(k)}
  else if(a==="pcgo"){const o=getA(k)||{};o._r=true;setA(k,o);rerenderBlock(k)}
  else if(a==="pccopy"){const b=blockOf(k),o=getA(k)||{};const items=b.items.map(s=>s.startsWith("@")?(named(s.slice(1).split("|")[0])||s.split("|")[1]):s);const lines=[`[${b.h.replace("미리 써 보기: ","")}]`,`${b.input}: ${o.in||"(비어 있음)"}`];if(b.judge)lines.push(`확인한 근거: ${o.src||"(비어 있음)"}`);items.forEach((s,i)=>lines.push(`${o["c"+i]?"☑":"☐"} ${s}`));if(b.judge)lines.push(`최종 판단: ${o.j&&o.j!=="선택하세요"?o.j:"(미선택)"}`,`판단 이유: ${o.why||"(비어 있음)"}`);copy(lines.join("\n"))}
  else if(a==="done"){const id=t.dataset.l;if(S.done[id]){location.hash="home";return}S.done[id]=true;save();toast(`${L.find(x=>x.id===id).house}에 불이 켜졌어요!`);rerenderBlock(k)}
});
document.addEventListener("keydown",e=>{const t=e.target.closest('[data-act="spot"]');if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click()}});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.act,k=t.dataset.k;
  if(a==="fill"){const o=getA(k)||{};o[t.dataset.i]=t.value;delete o._c;setA(k,o);rerenderBlock(k)}
  else if(a==="ck"||a==="cp"||a==="pcck"){const o=getA(k)||{};o[(a==="pcck"?"c":"")+t.dataset.i]=t.checked;if(a==="pcck")delete o._r;setA(k,o);rerenderBlock(k)}
  else if(a==="pt"){const o=getA(k)||{};o[t.dataset.key]=t.checked;setA(k,o);t.closest(".ck").classList.toggle("on",t.checked);updPrompt(k)}
  else if(a==="gd"){const o=getA(k)||{};o[t.dataset.i]=t.value;setA(k,o)}
  else if(a==="pcj"){const o=getA(k)||{};o.j=t.value;setA(k,o)}
  else if(a==="w"&&t.tagName==="SELECT"){S.a[t.dataset.fk]=t.value;save()}
});
document.addEventListener("input",e=>{
  const t=e.target,a=t.dataset.act,k=t.dataset.k;
  if(a==="w"){S.a[t.dataset.fk]=t.value;save()}
  else if(a==="pi"){const o=getA(k)||{};o[t.dataset.key]=t.value;setA(k,o);updPrompt(k)}
  else if(a==="pcin"||a==="pcsrc"||a==="pcwhy"){const o=getA(k)||{};o[{pcin:"in",pcsrc:"src",pcwhy:"why"}[a]]=t.value;setA(k,o)}
  else if(a==="cm"){const o=getA(k)||{};o[t.dataset.key]=t.value;setA(k,o);const txt=commentText(o);$("#cm-out").textContent=txt||"세 칸을 채우면 댓글이 완성돼요.";$("#cm-flags").innerHTML=flagHTML(redFlags(txt))}
});
function updPrompt(k){const el=document.getElementById("out-"+k.replace(/\./g,"-"));if(el)el.innerHTML=promptHTML(blockOf(k),k)}

/* ======================== 라우팅 ======================== */
function route(){const h=location.hash.replace("#","");if(/^l[1-6]$/.test(h))renderLesson(h);else{cur=null;renderHome()}window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
